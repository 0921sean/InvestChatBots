<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI펀드 — 4봇 경쟁</title>
<style>
  :root{--bg:#0f1216;--card:#171b21;--border:#262c34;--text:#e7ecf1;--muted:#9aa4b0;--faint:#6b7480;
    --up:#f85149;--down:#58a6ff;--gold:#c9a227;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;--sans:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1100px;margin:24px auto;padding:0 16px}
  header{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:18px}
  header h1{font-size:19px;margin:0;font-weight:800}
  header h1 span{color:var(--gold)}
  header .sub{font-size:12px;color:var(--faint);font-family:var(--mono)}
  .disc{font-size:11.5px;color:var(--faint);margin:-8px 0 16px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:480px){.grid{grid-template-columns:1fr}}
  .bot{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .bot .top{display:flex;align-items:baseline;justify-content:space-between}
  .bot .id{font-weight:800;font-size:16px}
  .bot .nm{font-size:11px;color:var(--muted)}
  .ret{font-family:var(--mono);font-size:20px;font-weight:800}
  .ret.up{color:var(--up)} .ret.down{color:var(--down)} .ret.flat{color:var(--muted)}
  .meta{font-size:11.5px;color:var(--faint);font-family:var(--mono);display:flex;justify-content:space-between}
  .pos{border-top:1px solid var(--border);padding-top:8px;display:flex;flex-direction:column;gap:5px;max-height:280px;overflow-y:auto}
  .pos .row{display:flex;justify-content:space-between;font-size:12px;font-family:var(--mono)}
  .pos .row .sym{color:var(--text)}
  .pos .row .p{color:var(--muted)}
  .pos .empty{color:var(--faint);font-size:12px;font-style:italic}
  footer{margin-top:20px;font-size:11px;color:var(--faint);text-align:center}
  .P{color:#5aa9e6}.W{color:#c9a227}.S{color:#e08a3c}.Q{color:#4bbf8a}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AI펀드 <span>· 4봇 경쟁</span></h1>
    <div class="sub" id="seed"></div>
  </header>
  <div class="disc">가상 포트폴리오 기준 · 투자자문·권유 아님 · 각 봇 시드 동일 · "어떤 대가 스타일이 이기나" 관전</div>
  <div class="grid" id="grid">불러오는 중…</div>
  <footer>NEW_DESK 개발 중 · 30초마다 갱신 · <a href="/" style="color:var(--faint)">← 메인</a></footer>
</div>
<script>
const KRW = n => "₩" + Math.round(n).toLocaleString();
function cls(r){ return r>0.05?"up":r<-0.05?"down":"flat"; }
async function load(){
  try{
    const d = await (await fetch("/api/fund")).json();
    document.getElementById("seed").textContent = "시드 각 " + KRW(d.seed);
    document.getElementById("grid").innerHTML = d.bots.map(b=>`
      <div class="bot">
        <div class="top"><span class="id ${b.bot}">${b.bot}</span><span class="nm">${b.name}</span></div>
        <div class="ret ${cls(b.return_pct)}">${b.return_pct>=0?"+":""}${b.return_pct.toFixed(2)}%</div>
        <div class="meta"><span>현금 ${KRW(b.cash)}</span><span>${b.n_positions}종목</span></div>
        <div class="pos">${
          b.positions.length ? b.positions.map(p=>`
            <div class="row"><span class="sym">${p.symbol}</span><span class="p">${
              p.pnl_pct!=null ? (p.pnl_pct>=0?"+":"")+p.pnl_pct+"%" : KRW(p.amount||0)
            }</span></div>`).join("")
          : `<div class="empty">보유 없음 (관망 중)</div>`
        }</div>
      </div>`).join("");
  }catch(e){ document.getElementById("grid").textContent = "불러오기 실패: "+e; }
}
load(); setInterval(load, 30000);
</script>
</body>
</html>
