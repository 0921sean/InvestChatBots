<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>운영 콘솔 — InvestChatBots</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1117; color: #e2e8f0; padding: 20px 16px 60px; max-width: 620px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .brand-emoji { font-size: 20px; }
  .brand-text { font-size: 15px; font-weight: 700; }
  .sub { font-size: 11px; color: #8b949e; margin-bottom: 16px; line-height: 1.5; }
  .card { background: #161b22; border: 1px solid #9e6a03; border-radius: 12px; padding: 14px 15px; margin-bottom: 12px; }
  .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .tk { font-size: 17px; font-weight: 800; }
  .code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; color: #8b949e; }
  .desk { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; margin-left: auto; }
  .d-big { background: #16304a; color: #6cb6ff; }
  .d-disc { background: #3a2a12; color: #f0a752; }
  .nums { font-size: 12px; color: #c9d1d9; margin-top: 8px; }
  .nums b { color: #e2e8f0; }
  .sec { font-size: 11px; font-weight: 700; margin: 12px 0 4px; letter-spacing: .03em; }
  .s-co { color: #8b949e; } .s-why { color: #56d364; } .s-q { color: #6cb6ff; }
  .txt { font-size: 12.5px; line-height: 1.65; color: #c9d1d9; white-space: pre-wrap; }
  .acts { display: flex; gap: 8px; margin-top: 14px; }
  button { border: none; border-radius: 7px; font-size: 14px; cursor: pointer; font-weight: 800;
    padding: 10px 14px; color: #fff; transition: opacity .15s; }
  button:active { opacity: .7; } button:disabled { opacity: .4; }
  .ok { background: #238636; flex: 1; } .no { background: #6e2f30; flex: 1; }
  .empty { font-size: 13px; color: #6e7681; padding: 20px 2px; text-align: center; }
  .sec-title { font-size: 12px; font-weight: 700; color: #8b949e; letter-spacing: .03em; margin: 22px 0 8px; text-transform: uppercase; }
  .done { border-color: #30363d; opacity: .75; }
  .badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; margin-left: auto; }
  .b-app { background: #12331f; color: #56d364; } .b-rej { background: #3a2224; color: #f0757c; }
  a.back { display: inline-block; margin-top: 24px; font-size: 11px; color: #6e7681; text-decoration: none; }
  .askbox { margin-top: 10px; }
  .askbox input { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 7px;
    padding: 9px 11px; color: #e2e8f0; font-size: 12.5px; outline: none; margin-bottom: 6px; }
  .askbox input:focus { border-color: #8957e5; }
  .askbox .ask { width: 100%; background: #6f42c1; font-size: 12.5px; padding: 9px; }
  .qna { background: #14121c; border-left: 2px solid #8957e5; border-radius: 6px;
    padding: 8px 10px; margin-bottom: 8px; }
  .qna .q { font-size: 12px; font-weight: 800; color: #d2a8ff; margin-bottom: 4px; }
  .qna .qat { font-size: 10px; color: #6e7681; margin-top: 4px; }
  .brief { background: #12161f; border: 1px solid #2b3550; border-radius: 12px; padding: 14px 15px; margin-bottom: 18px; }
  .brief h3 { font-size: 12px; font-weight: 800; color: #8b8cf0; margin-bottom: 4px; letter-spacing: .02em; }
  .brief .date { font-size: 10px; color: #6e7681; margin-bottom: 8px; }
  .brief .body { font-size: 12.5px; line-height: 1.7; color: #c9d1d9; white-space: pre-wrap; }
  /* ── 관전 지표 패널 (방문/피드백/채팅) ── */
  .panel { background: #12161f; border: 1px solid #21262d; border-radius: 12px; margin-bottom: 10px; }
  .panel > summary { cursor: pointer; padding: 13px 15px; font-size: 12.5px; font-weight: 800; color: #c9d1d9; list-style: none; }
  .panel > summary::-webkit-details-marker { display: none; }
  .panel > summary::before { content: '▸ '; color: #6e7681; }
  .panel[open] > summary::before { content: '▾ '; }
  .panel .pbody { padding: 0 15px 14px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .kpi { background: #0d1117; border: 1px solid #21262d; border-radius: 8px; padding: 9px 6px; text-align: center; }
  .kpi .n { font-size: 17px; font-weight: 800; color: #e2e8f0; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 9px; color: #6e7681; margin-top: 2px; }
  .rows { display: flex; flex-direction: column; gap: 5px; }
  .row { display: flex; align-items: baseline; gap: 8px; font-size: 11.5px; color: #8b949e; font-variant-numeric: tabular-nums; }
  .row .d { min-width: 46px; color: #c9d1d9; }
  .row .bar { flex: 1; height: 7px; background: #0d1117; border-radius: 4px; overflow: hidden; display: flex; }
  .row .bar i { display: block; height: 100%; }
  .row .n { min-width: 108px; text-align: right; font-size: 10.5px; }
  .ptitle { font-size: 10px; font-weight: 700; color: #6e7681; text-transform: uppercase; letter-spacing: .04em; margin: 12px 0 6px; }
  .fb { background: #0d1117; border: 1px solid #21262d; border-radius: 8px; padding: 9px 11px; margin-bottom: 6px; }
  .fb.unread { border-color: #9e6a03; }
  .fb .t { font-size: 12.5px; color: #e2e8f0; line-height: 1.55; white-space: pre-wrap; }
  .fb .m { font-size: 10px; color: #6e7681; margin-top: 5px; }
  .cl { background: #0d1117; border: 1px solid #21262d; border-radius: 8px; padding: 10px 12px; margin-bottom: 7px; }
  .cl .q { font-size: 12.5px; font-weight: 800; color: #6cb6ff; }
  .cl .ts { font-size: 10px; color: #6e7681; margin: 3px 0 6px; }
  .cl .a { font-size: 11.5px; color: #8b949e; line-height: 1.55; margin-top: 5px; }
  .cl .a b { color: #c9d1d9; }
</style>
</head>
<body>
  <div class="brand"><span class="brand-emoji">🛠️</span><span class="brand-text">운영 콘솔</span></div>
  <div class="sub">담당 봇들이 매수를 <b>건의</b>드린 종목입니다. 회사 소개·매수 사유·진입 타이밍을 검토하시고 결재해 주세요. <b>승인하면 봇 판단 시점 가격으로 체결</b>, 거부하면 매수하지 않습니다. 사이클은 결재와 무관하게 계속 돕니다. (청산·손절은 자동)</div>

  <div id="risk"></div>
  <div id="briefing"></div>
  <div id="weekly"></div>

  <div class="sec-title">🟡 결재 대기</div>
  <div id="pending"></div>

  <div class="sec-title">📗 최근 처리</div>
  <div id="done"></div>

  <div class="sec-title">🔩 병목 시드 결재 <span style="font-weight:400;text-transform:none">— 승인해도 매수 아님(F봇 분석 대상 편입만)</span></div>
  <div id="seed-pending"></div>
  <div class="add" style="background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px 14px;margin-top:6px">
    <input id="addTk" placeholder="티커 수동 추가 (예: AXTI)" autocapitalize="characters"
      style="width:100%;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:9px 11px;color:#e2e8f0;font-size:13px;outline:none;margin-bottom:8px" />
    <button onclick="addSeed()" style="background:#1f6feb;width:100%">pending으로 등록</button>
  </div>
  <details style="margin-top:8px"><summary style="cursor:pointer;font-size:11px;color:#6e7681">승인된 워치리스트 보기</summary><div id="seed-approved" style="margin-top:8px"></div></details>

  <div class="sec-title" style="margin-top:26px">📈 서비스 지표</div>

  <details class="panel" ontoggle="if(this.open)loadVisits()">
    <summary>📊 방문 통계</summary>
    <div class="pbody" id="visits">불러오는 중…</div>
  </details>

  <details class="panel" ontoggle="if(this.open)loadFeedback()">
    <summary>📨 피드백 <span id="fb-badge" style="color:#f0a752"></span></summary>
    <div class="pbody" id="feedback">불러오는 중…</div>
  </details>

  <details class="panel" ontoggle="if(this.open)loadChats()">
    <summary>🗨 사용자 채팅 기록</summary>
    <div class="pbody" id="chats">불러오는 중…</div>
  </details>

  <a class="back" href="/">← 관전 화면으로</a>

<script>
const esc = s => (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ROLE = {P:'성장주', W:'가치주', H:'실적', S:'병목'};
const fmtPrice = (v, mkt) => mkt === 'US'
  ? '$' + Number(v||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})
  : '₩' + Math.round(v||0).toLocaleString();
const roles = a => (a||'').split(',').filter(Boolean).map(x => ROLE[x] || x).join('·');

function card(it) {
  const deskCls = it.desk === '대형주' ? 'd-big' : 'd-disc';
  const co = (it.stock_desc||'').trim();
  const why = (it.reason||'').trim();
  const q = (it.q_comment||'').trim();
  const who = roles(it.approvers);
  return `<div class="card">
    <div class="head"><span class="tk">${esc(it.ticker)}</span><span class="code">${esc(it.code)}</span>
      <span class="desk ${deskCls}">${esc(it.desk)}</span></div>
    <div class="nums">판단가 <b>${fmtPrice(it.decision_price, it.market)}</b> · 투자금 <b>₩${Math.round(it.amount||0).toLocaleString()}</b>${who ? ` · 찬성 <b>${esc(who)}</b>` : ''}</div>
    ${co ? `<div class="sec s-co">🏢 회사 소개</div><div class="txt">${esc(co)}</div>` : ''}
    ${why ? `<div class="sec s-why">📈 매수 사유 (담당 봇 의견)</div><div class="txt">${esc(why)}</div>` : ''}
    ${q ? `<div class="sec s-q">⏱️ 진입 타이밍</div><div class="txt">${esc(q)}</div>` : ''}
    ${qnaHtml(it)}
    <div class="acts">
      <button class="ok" onclick="decide(${it.id},'approved',this)">✅ 승인 (매수)</button>
      <button class="no" onclick="decide(${it.id},'rejected',this)">❌ 거부 (매수 X)</button>
    </div>
    <div class="askbox">
      <input id="ask-${it.id}" placeholder="궁금한 점을 물어보세요 (예: 수도관 수요는 왜 올라가나요?)"
             onkeydown="if(event.key==='Enter')askBot(${it.id})" />
      <button class="ask" onclick="askBot(${it.id})">💬 담당 봇에게 물어보기</button>
    </div></div>`;
}

async function loadRisk() {
  try {
    const r = await fetch('/api/risk', { credentials: 'same-origin' });
    if (!r.ok) return;
    const d = await r.json();
    if (!d.enabled) return;
    const b = d.breakers || {};
    const tripped = b.kill_switch || b.data_anomaly || (b.daily_loss_halted||[]).length;
    const on = b.kill_switch;
    const badge = tripped
      ? `<span style="color:#f85149;font-weight:800">🛑 매매 중단</span> ` +
        [b.kill_switch?'킬스위치':'', b.data_anomaly?'데이터이상':'',
         (b.daily_loss_halted||[]).length?`일일손실(${b.daily_loss_halted.join('·')})`:''].filter(Boolean).join(' · ')
      : `<span style="color:#56d364;font-weight:800">🟢 정상</span> — 회로차단기 대기`;
    document.getElementById('risk').innerHTML =
      `<div class="brief" style="border-color:${tripped?'#6e2f30':'#2b3550'};margin-bottom:14px">
        <h3 style="color:#e0637c">🛡️ 리스크 가드</h3><div class="body" style="font-size:12px">${badge}</div>
        <button onclick="toggleKill(${on?0:1})" style="margin-top:10px;width:100%;padding:9px;border:none;border-radius:7px;font-weight:800;cursor:pointer;color:#fff;background:${on?'#238636':'#6e2f30'}">
          ${on?'✅ 매매 재개 (킬스위치 OFF)':'🛑 전체 매매 중단 (킬스위치 ON)'}</button>
      </div>`;
  } catch(e){}
}
async function toggleKill(on) {
  if (!on && !confirm('킬스위치를 켜면 모든 신규매수가 즉시 중단됩니다 (승인해도 차단). 진행할까요?')) {}
  const r = await fetch('/api/risk/kill-switch', {method:'POST',credentials:'same-origin',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify({on: !!on})});
  if (r.ok) loadRisk();
}
async function loadBriefing() {
  try {
    const r = await fetch('/api/macro-briefing', { credentials: 'same-origin' });
    if (!r.ok) return;
    const b = await r.json();
    if (!b || !b.content) return;
    document.getElementById('briefing').innerHTML =
      `<div class="brief"><h3>🧭 오늘의 거시 브리핑</h3>` +
      `<div class="date">${esc(b.date || '')}</div>` +
      `<div class="body">${esc(b.content)}</div></div>`;
  } catch (e) { /* 브리핑 없어도 결재는 표시 */ }
}

async function loadWeekly() {
  try {
    const r = await fetch('/api/weekly-report', { credentials: 'same-origin' });
    if (!r.ok) return;
    const w = await r.json();
    if (!w || !w.content) return;
    document.getElementById('weekly').innerHTML =
      `<details class="brief" style="margin-bottom:18px"><summary style="cursor:pointer;font-size:12px;font-weight:800;color:#56d364">📊 주간 성과 리포트 (${esc(w.date||'')}) — 펼쳐보기</summary>` +
      `<div class="body" style="margin-top:8px">${esc(w.content)}</div></details>`;
  } catch (e) { /* 없어도 무시 */ }
}

function qnaHtml(it) {
  let arr = [];
  try { arr = JSON.parse(it.qna || '[]'); } catch (e) {}
  if (!arr.length) return '';
  return `<div class="sec" style="color:#d2a8ff">💬 사장님 질문 · 추가 검토</div>` +
    arr.map(x => `<div class="qna"><div class="q">Q. ${esc(x.q)}</div>` +
      `<div class="txt">${esc(x.a)}</div>` +
      `<div class="qat">${esc(x.at || '')}</div></div>`).join('');
}

async function askBot(id) {
  const el = document.getElementById('ask-' + id);
  const q = (el.value || '').trim();
  if (!q) return;
  el.disabled = true;
  const box = el.parentElement;
  const old = box.querySelector('.ask').textContent;
  box.querySelector('.ask').textContent = '🤔 담당 봇이 다시 검토 중… (최대 1~2분)';
  box.querySelector('.ask').disabled = true;
  try {
    const r = await fetch('/api/buy-approvals/ask', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, question: q }),
    });
    if (!r.ok) { alert('실패: ' + (await r.text())); }
    else { el.value = ''; }
  } catch (e) { alert('오류: ' + e); }
  el.disabled = false;
  box.querySelector('.ask').textContent = old;
  box.querySelector('.ask').disabled = false;
  load();
}

async function load() {
  loadRisk();
  loadBriefing();
  loadWeekly();
  const [p, d] = await Promise.all([
    fetch('/api/buy-approvals?status=pending', {credentials:'same-origin'}),
    fetch('/api/buy-approvals?status=all', {credentials:'same-origin'}),
  ]);
  if (!p.ok) { document.getElementById('pending').innerHTML = '<div class="empty">권한이 없습니다. /admin에서 로그인하세요.</div>'; return; }
  const pend = (await p.json()).items || [];
  document.getElementById('pending').innerHTML = pend.length ? pend.map(card).join('')
    : '<div class="empty">대기 중인 결재가 없습니다. 👍</div>';
  const all = (await d.json()).items || [];
  const done = all.filter(x => x.status !== 'pending').slice(0, 15);
  document.getElementById('done').innerHTML = done.length ? done.map(it => `
    <div class="card done"><div class="head"><span class="tk">${esc(it.ticker)}</span>
      <span class="code">${esc(it.code)}</span>
      <span class="badge ${it.status==='approved'?'b-app':'b-rej'}">${it.status==='approved'?'승인·매수':'거부'}</span></div></div>`).join('')
    : '<div class="empty">아직 없습니다.</div>';
}

async function decide(id, status, btn) {
  btn.disabled = true;
  const sib = btn.parentElement.querySelectorAll('button'); sib.forEach(b => b.disabled = true);
  const r = await fetch('/api/buy-approvals/decide', {
    method:'POST', credentials:'same-origin',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({id, status}),
  });
  if (!r.ok) { sib.forEach(b => b.disabled = false); alert('실패: ' + (await r.text())); return; }
  const j = await r.json();
  if (status === 'approved' && j.note) alert(j.note);
  load();
}

async function loadSeeds() {
  try {
    const r = await fetch('/api/bottleneck/seeds', { credentials: 'same-origin' });
    if (!r.ok) return;
    const items = (await r.json()).items || [];
    const pend = items.filter(i => i.status === 'pending');
    document.getElementById('seed-pending').innerHTML = pend.length ? pend.map(i => `
      <div class="card" style="border-color:#9e6a03">
        <div class="head"><span class="tk" style="font-size:14px">${esc(i.ticker)}</span></div>
        ${i.rationale ? `<div class="txt" style="margin-top:4px">${esc(i.rationale)}</div>` : ''}
        <div class="acts">
          <button class="ok" onclick="decideSeed('${esc(i.ticker)}','approved',this)">✅ 워치리스트 편입</button>
          <button class="no" onclick="decideSeed('${esc(i.ticker)}','rejected',this)">❌ 반려</button>
        </div></div>`).join('') : '<div class="empty">대기 중인 시드 후보가 없습니다.</div>';
    const app = items.filter(i => i.status === 'approved');
    document.getElementById('seed-approved').innerHTML = app.map(i =>
      `<span style="display:inline-block;background:#12331f;color:#56d364;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;margin:0 4px 6px 0">${esc(i.ticker)}</span>`).join('') || '<div class="empty">없음</div>';
  } catch (e) {}
}
async function decideSeed(ticker, status, btn) {
  btn.disabled = true;
  const r = await fetch('/api/bottleneck/seeds/decide', {
    method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ ticker, status }) });
  if (!r.ok) { btn.disabled = false; alert('실패: ' + (await r.text())); return; }
  loadSeeds();
}
async function addSeed() {
  const ticker = document.getElementById('addTk').value.trim();
  if (!ticker) return;
  const r = await fetch('/api/bottleneck/seeds/add', {
    method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ ticker, rationale: '' }) });
  if (!r.ok) { alert('실패: ' + (await r.text())); return; }
  document.getElementById('addTk').value = '';
  loadSeeds();
}
// ───── 서비스 지표 (방문·피드백·채팅) — 펼칠 때만 로드 ─────
const fmtTs = t => t ? new Date(t.replace(' ', 'T') + 'Z').toLocaleString('ko-KR',
  { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false }) : '—';

async function loadVisits() {
  const el = document.getElementById('visits');
  try {
    const r = await fetch('/api/admin/visits?days=30', { credentials: 'same-origin' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = (await r.json()).verified || {};
    const t = d.totals || {};
    // by_day는 최신순(DESC)이고 방문 없는 날은 행 자체가 없다.
    // 최근 14일을 날짜축으로 깔고 채운다 — 아무도 안 온 날도 보여야 추이가 안 왜곡됨.
    const byDay = Object.fromEntries((d.by_day || []).map(x => [x.day, x]));
    const anchor = d.today || (d.by_day || [{}])[0].day;
    const days = anchor ? [...Array(14)].map((_, i) => {
      const day = new Date(Date.parse(anchor + 'T00:00:00Z') - i * 86400000).toISOString().slice(0, 10);
      return byDay[day] || { day, uv: 0, new_uv: 0, returning_uv: 0, pv: 0 };
    }) : [];
    const peak = Math.max(1, ...days.map(x => x.uv || 0));
    const bars = days.map(x => {
      const nw = Math.round(((x.new_uv || 0) / peak) * 100);
      const rt = Math.round(((x.returning_uv || 0) / peak) * 100);
      return `<div class="row"${x.uv ? '' : ' style="opacity:.4"'}><span class="d">${esc((x.day || '').slice(5))}</span>` +
        `<span class="bar"><i style="width:${nw}%;background:#3b82f6"></i><i style="width:${rt}%;background:#22c55e"></i></span>` +
        `<span class="n">${x.uv ? `신규 ${x.new_uv || 0} · 재방문 ${x.returning_uv || 0}` : '방문 없음'}</span></div>`;
    }).join('') || '<div class="empty">아직 방문 기록이 없습니다.</div>';
    const src = (d.by_source || []).map(x =>
      `<div class="row"><span class="d">${esc(x.source || '?')}</span>` +
      `<span class="n" style="min-width:auto">UV ${x.uv || 0} · ${x.pv || 0}PV</span></div>`).join('');
    const coh = (d.cohorts || []).slice(0, 7).map(x =>
      `<div class="row"><span class="d">${esc((x.cohort || '').slice(5))}</span>` +
      `<span class="n" style="min-width:auto">신규 ${x.cohort_size || 0} → D1 ${x.d1 || 0} · D7 ${x.d7 || 0}</span></div>`).join('');
    el.innerHTML =
      `<div class="kpis">
         <div class="kpi"><div class="n">${t.unique_visitors ?? 0}</div><div class="l">고유 방문자</div></div>
         <div class="kpi"><div class="n">${t.page_views ?? 0}</div><div class="l">페이지뷰</div></div>
         <div class="kpi"><div class="n">${t.returning_visitors ?? 0}</div><div class="l">재방문자</div></div>
         <div class="kpi"><div class="n">${t.returning_rate ?? 0}%</div><div class="l">재방문율</div></div>
       </div>
       <div class="ptitle">날짜별 (최근 14일 · 파랑=신규 초록=재방문)</div><div class="rows">${bars}</div>
       ${src ? `<div class="ptitle">유입 출처</div><div class="rows">${src}</div>` : ''}
       ${coh ? `<div class="ptitle">재방문 코호트 — 관전 후 다시 오나? (전체 D1 ${(d.retention||{}).d1_rate ?? 0}% · D7 ${(d.retention||{}).d7_rate ?? 0}%)</div><div class="rows">${coh}</div>` : ''}`;
  } catch (e) { el.innerHTML = `<div class="empty">불러오지 못함: ${esc(e.message)}</div>`; }
}

async function loadFeedback() {
  const el = document.getElementById('feedback');
  try {
    const r = await fetch('/api/admin/feedback?limit=50', { credentials: 'same-origin' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    const items = d.items || [];
    document.getElementById('fb-badge').textContent = d.unread_count ? `· 안읽음 ${d.unread_count}` : '';
    el.innerHTML = (items.length
      ? items.map(x => `<div class="fb${x.is_read ? '' : ' unread'}"><div class="t">${esc(x.content)}</div>` +
          `<div class="m">${fmtTs(x.ts)}${x.is_read ? '' : ' · 🆕'}</div></div>`).join('')
      : '<div class="empty">아직 피드백이 없습니다.</div>')
      + (d.unread_count ? '<button onclick="readAllFeedback()" style="background:#1f6feb;width:100%;margin-top:6px;font-size:12.5px;padding:9px">전체 읽음 처리</button>' : '');
  } catch (e) { el.innerHTML = `<div class="empty">불러오지 못함: ${esc(e.message)}</div>`; }
}
async function readAllFeedback() {
  await fetch('/api/admin/feedback/read?id=0', { method: 'POST', credentials: 'same-origin' });
  loadFeedback();
}

async function loadChats() {
  const el = document.getElementById('chats');
  try {
    const r = await fetch('/api/admin/chats?limit=30', { credentials: 'same-origin' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const items = (await r.json()).items || [];
    el.innerHTML = items.length ? items.map(x =>
      `<div class="cl"><div class="q">${esc(x.question)}</div><div class="ts">${fmtTs(x.ts)}</div>` +
      (x.answers || []).map(a => `<div class="a"><b>${esc(a.agent)}</b> ${esc(a.content)}</div>`).join('') +
      `</div>`).join('') : '<div class="empty">아직 사용자 채팅이 없습니다.</div>';
  } catch (e) { el.innerHTML = `<div class="empty">불러오지 못함: ${esc(e.message)}</div>`; }
}

loadSeeds();
load();
</script>
