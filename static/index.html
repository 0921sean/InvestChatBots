<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InvestChat</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1c1c1e; color: #e2e8f0; height: 100vh; display: flex; overflow: hidden; }

  #sidebar { width: 220px; background: #1a1d21; border-right: 1px solid #2a2d31; display: flex; flex-direction: column; flex-shrink: 0; }
  #sidebar-title { padding: 16px 12px 12px; font-size: 15px; font-weight: 700; border-bottom: 1px solid #2a2d31; }
  .sidebar-section { padding: 12px 0 4px; }
  .sidebar-label { padding: 4px 16px; font-size: 11px; font-weight: 600; letter-spacing: .8px; color: #9d9d9d; text-transform: uppercase; }
  .channel { padding: 5px 16px; font-size: 14px; color: #9d9d9d; cursor: pointer; border-radius: 4px; margin: 1px 8px; }
  .channel.active { background: #4a154b; color: #e8e8e8; }
  .member { padding: 5px 12px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .member-name { font-weight: 600; }
  .member-sub { font-size: 10px; color: #9d9d9d; padding: 0 24px 4px; }
  #market-ticker { padding: 12px; border-top: 1px solid #2a2d31; background: #2a2d31; border-radius: 6px; margin: auto 12px 12px; font-size: 11px; color: #9d9d9d; line-height: 1.7; }
  #market-ticker .live { color: #2bac76; font-weight: 600; }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chat-header { padding: 12px 16px; border-bottom: 1px solid #2a2d31; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  #chat-header h2 { font-size: 15px; display: inline; }
  #chat-header .sub { font-size: 12px; color: #9d9d9d; margin-left: 10px; }
  .btn { border: none; border-radius: 4px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
  .btn-ghost { background: #2a2d31; color: #9d9d9d; }
  .btn-primary { background: #4a154b; color: #e8e8e8; }
  .btn-play { background: #166534; color: #86efac; transition: background .2s; }
  .btn-play.playing { background: #7f1d1d; color: #fca5a5; }
  .btn-group { display: flex; gap: 8px; }

  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg-system { text-align: center; }
  .msg-system span { background: #2a2d31; color: #9d9d9d; font-size: 11px; padding: 3px 12px; border-radius: 12px; }
  .msg { display: flex; gap: 10px; align-items: flex-start; }
  .msg.user-msg { flex-direction: row-reverse; }
  .avatar { width: 36px; height: 36px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; flex-shrink: 0; border: 2px solid; }
  .msg-body { max-width: 480px; }
  .msg.user-msg .msg-body { text-align: right; }
  .msg-meta { font-size: 11px; color: #9d9d9d; margin-bottom: 4px; display: flex; align-items: baseline; gap: 6px; }
  .msg.user-msg .msg-meta { flex-direction: row-reverse; }
  .msg-name { font-weight: 700; font-size: 14px; }
  .msg-bubble { font-size: 13px; line-height: 1.7; padding: 10px 14px; border-radius: 0 8px 8px 8px; background: #2a2d31; display: inline-block; text-align: left; }
  .msg.user-msg .msg-bubble { border-radius: 8px 0 8px 8px; background: #fbbf24; color: #1c1c1e; }
  #typing { display: none; align-items: center; gap: 10px; padding: 4px 16px; }
  .typing-dots { font-size: 12px; color: #9d9d9d; }

  #input-area { padding: 12px 16px; border-top: 1px solid #2a2d31; display: flex; gap: 10px; flex-shrink: 0; }
  #input-area input { flex: 1; background: #2a2d31; border: 1px solid #3a3d41; border-radius: 6px; padding: 10px 14px; color: #e8e8e8; font-size: 13px; outline: none; }
  #input-area input:focus { border-color: #6366f1; }
  #input-area button { background: #4a154b; border: none; color: #e8e8e8; padding: 9px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; }

  /* 에이전트 프로필 모달 */
  #profile-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100; align-items:center; justify-content:center; }
  #profile-modal.open { display:flex; }
  #profile-box { background:#1e2229; border:1px solid #3a3d41; border-radius:12px; padding:24px; max-width:420px; width:90%; position:relative; }
  #profile-box h3 { font-size:16px; font-weight:700; margin-bottom:4px; }
  #profile-box .p-desc { font-size:11px; color:#9d9d9d; margin-bottom:14px; }
  #profile-box .p-section { font-size:12px; color:#cbd5e1; line-height:1.8; }
  #profile-box .p-label { font-size:10px; font-weight:600; letter-spacing:.8px; color:#6366f1; text-transform:uppercase; margin-top:12px; margin-bottom:4px; }
  #profile-close { position:absolute; top:12px; right:14px; background:none; border:none; color:#9d9d9d; font-size:18px; cursor:pointer; }
  .member-row { cursor:pointer; border-radius:4px; transition:background .15s; }
  .member-row:hover { background:rgba(255,255,255,0.07); }

  /* 오른쪽 합의 메모 패널 */
  #memo-panel { width: 260px; background: #1a1d21; border-left: 1px solid #2a2d31; display: flex; flex-direction: column; flex-shrink: 0; }
  #memo-header { padding: 14px 14px 10px; border-bottom: 1px solid #2a2d31; }
  #memo-header h3 { font-size: 13px; font-weight: 700; color: #e2e8f0; }
  #memo-header p { font-size: 10px; color: #9d9d9d; margin-top: 2px; }
  #memo-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  .memo-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; border-left: 3px solid #6366f1; }
  .memo-card:first-child { border-left-color: #22c55e; }
  .memo-time { font-size: 10px; color: #475569; margin-bottom: 6px; }
  .memo-body { font-size: 12px; line-height: 1.7; color: #cbd5e1; white-space: pre-wrap; }
  #memo-empty { font-size: 12px; color: #475569; text-align: center; padding: 24px 12px; line-height: 1.7; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-title">📈 InvestChat</div>
  <div class="sidebar-section">
    <div class="sidebar-label">Channels</div>
    <div class="channel active"># war-room</div>
    <div class="channel"># market-pulse</div>
  </div>
  <div class="sidebar-section">
    <div class="sidebar-label">Members</div>
    <div id="member-list"></div>
  </div>
  <div id="market-ticker"><span class="live">● Loading market...</span></div>
</div>

<div id="main">
  <div id="chat-header">
    <div>
      <h2># war-room</h2>
      <span class="sub" id="round-label"></span>
    </div>
    <div class="btn-group">
      <button class="btn btn-play" id="btn-play" onclick="togglePlay()" style="display:none">▶ Resume</button>
      <button class="btn btn-play playing" id="btn-pause" onclick="togglePlay()">⏸ Pause</button>
      <button class="btn btn-primary" onclick="scrollToBottom()">↓ Latest</button>
    </div>
  </div>
  <div id="messages"></div>
  <div id="typing">
    <span class="typing-dots" id="typing-text">Agents are responding...</span>
  </div>
  <div id="user-mode-banner" style="display:none;background:#1e2a1e;border-top:1px solid #166534;padding:6px 16px;font-size:11px;color:#86efac;flex-shrink:0;">💬 사용자 응답 대기 중 — 5분 무응답 시 AI 자율 대화 자동 재개.</div>
  <div id="input-area">
    <input id="msg-input" placeholder="Message #war-room..." onkeydown="if(event.key==='Enter')sendMessage()" />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<div id="profile-modal" onclick="if(event.target===this)closeProfile()">
  <div id="profile-box">
    <button id="profile-close" onclick="closeProfile()">✕</button>
    <h3 id="p-name"></h3>
    <div class="p-desc" id="p-desc"></div>
    <div class="p-label">투자 철학</div>
    <div class="p-section" id="p-beliefs"></div>
    <div class="p-label">모델</div>
    <div class="p-section" id="p-model"></div>
    <div class="p-label">관점 변화</div>
    <div class="p-section" id="p-evolution"></div>
  </div>
</div>

<div id="memo-panel">
  <div id="memo-header">
    <h3>📌 합의 메모</h3>
    <p>5라운드마다 분석 · 자동 업데이트</p>
  </div>
  <div id="memo-list">
    <div id="memo-empty">아직 합의된 결론이<br>없습니다.<br><br>대화가 쌓이면<br>자동으로 채워집니다.</div>
  </div>
</div>

<script>
const COLORS = {
  가치파: '#fbbf24', 트레이더: '#60a5fa', 퀀트: '#a78bfa',
  강세파: '#f472b6', 안전파: '#34d399', 매크로: '#38bdf8',
  애널리스트: '#fb923c', 회의론자: '#f87171', User: '#fbbf24', System: '#6366f1'
};

let lastId = 0;
let agents = {};

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function timeStr() {
  return new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'});
}

function avatar(name) {
  const color = COLORS[name] || '#9d9d9d';
  return `<div class="avatar" style="color:${color};background:${color}22;border-color:${color}">${name[0]}</div>`;
}

function renderMessage(msg) {
  const el = document.createElement('div');
  if (msg.agent_name === 'System') {
    el.className = 'msg-system';
    el.innerHTML = `<span>${esc(msg.content)}</span>`;
  } else if (msg.agent_name === 'User') {
    const color = COLORS['User'];
    el.className = 'msg user-msg';
    el.innerHTML = `${avatar('User')}<div class="msg-body"><div class="msg-meta"><span class="msg-name" style="color:${color}">You</span><span>${timeStr()}</span></div><span class="msg-bubble">${esc(msg.content)}</span></div>`;
  } else {
    const color = COLORS[msg.agent_name] || '#9d9d9d';
    const sub = agents[msg.agent_name]?.description || '';
    el.className = 'msg';
    el.innerHTML = `${avatar(msg.agent_name)}<div class="msg-body"><div class="msg-meta"><span class="msg-name" style="color:${color}">${esc(msg.agent_name)}</span><span style="color:#9d9d9d;font-size:10px">${esc(sub)}</span><span>${timeStr()}</span></div><span class="msg-bubble">${esc(msg.content)}</span></div>`;
  }
  return el;
}

function scrollToBottom() {
  const el = document.getElementById('messages');
  el.scrollTop = el.scrollHeight;
}

async function poll() {
  try {
    const res = await fetch(`/api/messages?since=${lastId}`);
    if (!res.ok) return;
    const msgs = await res.json();
    if (msgs.length) {
      const container = document.getElementById('messages');
      const atBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 80;
      msgs.forEach(m => {
        container.appendChild(renderMessage(m));
        if (m.id > lastId) lastId = m.id;
      });
      if (atBottom) scrollToBottom();
    }
  } catch(e) {}
}

const BELIEFS = {
  가치파: ['복리와 장기 가치투자 신봉', '밸류에이션 > 모멘텀', '구조적 트렌드가 진짜 수익을 만든다'],
  트레이더:  ['가격이 진실, 나머지는 노이즈', '손실 빠르게 끊고 수익 길게', '어느 방향이든 빠른 대응이 답'],
  퀀트:      ['알파는 팩터 익스포저에서 나온다', '백테스트 검증 없인 투자 아님', '변동성은 정량화할 수 있는 기회'],
  강세파:    ['가장 큰 리스크는 리스크를 안 지는 것', '시장은 혁신 속도를 늘 과소평가', '집중투자 > 분산투자 (확신 있을 때)'],
  안전파:    ['자본 보존이 먼저, 증식은 그 다음', '분산과 리밸런싱은 생존 전략', '위험 조정 수익률이 절대 수익률보다 중요'],
  매크로:    ['중앙은행과 싸우지 마라', '금리·환율 사이클이 모든 것을 결정', '지정학 리스크는 항상 가격보다 빠르다'],
  애널리스트:['좋은 사업을 적정 가격에 사는 것이 가장 안전', '경쟁 해자 없는 고ROE는 언제든 무너진다', '경영진 자본배분 능력이 장기 수익률을 결정'],
  회의론자:  ['시장 합의는 곧 반전의 씨앗', '아무도 안 묻는 리스크가 진짜 리스크', '강세장 논리가 가장 그럴듯할 때가 가장 위험'],
};

function openProfile(name) {
  const a = agents[name];
  if (!a) return;
  const color = COLORS[name] || '#9d9d9d';
  document.getElementById('p-name').textContent = name;
  document.getElementById('p-name').style.color = color;
  document.getElementById('p-desc').textContent = a.description + ' · ' + a.model_provider;
  const beliefs = BELIEFS[name] || [];
  document.getElementById('p-beliefs').innerHTML = beliefs.map(b => `• ${b}`).join('<br>');
  document.getElementById('p-model').textContent = a.model_provider + ' — ' + (a.description || '');
  document.getElementById('p-evolution').textContent = a.evolution_notes || '아직 관점 변화 없음.';
  document.getElementById('profile-modal').classList.add('open');
}
function closeProfile() {
  document.getElementById('profile-modal').classList.remove('open');
}

async function loadAgents() {
  try {
    const res = await fetch('/api/agents');
    const list = await res.json();
    const el = document.getElementById('member-list');
    el.innerHTML = '';
    list.forEach(a => {
      agents[a.name] = a;

      const row = document.createElement('div');
      row.className = 'member member-row';
      row.style.cssText = 'padding:5px 12px;';
      row.onclick = () => openProfile(a.name);

      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = a.color;

      const nameEl = document.createElement('span');
      nameEl.className = 'member-name';
      nameEl.style.color = a.color;
      nameEl.textContent = a.name;

      row.appendChild(dot);
      row.appendChild(nameEl);

      const sub = document.createElement('div');
      sub.className = 'member-sub';
      sub.textContent = `${a.description} · ${a.model_provider}`;

      el.appendChild(row);
      el.appendChild(sub);
    });

    const youRow = document.createElement('div');
    youRow.className = 'member';
    youRow.style.marginTop = '6px';
    youRow.innerHTML = `<span class="dot" style="background:#fbbf24"></span><span class="member-name" style="color:#fbbf24">You</span>`;
    el.appendChild(youRow);
  } catch(e) {}
}

async function loadMarket() {
  try {
    const res = await fetch('/api/market');
    const snap = await res.json();
    if (snap && snap.data) {
      const d = JSON.parse(snap.data);
      const md = d.data || {};
      const lines = Object.entries(md).slice(0,3).map(([k,v]) => {
        if (v.price === null || v.change_pct === null) return '';
        const arrow = v.change_pct >= 0 ? '▲' : '▼';
        const col = v.change_pct >= 0 ? '#2bac76' : '#f87171';
        return `<span style="color:${col}">${k} ${arrow}${Math.abs(v.change_pct).toFixed(1)}%</span>`;
      }).filter(Boolean);
      document.getElementById('market-ticker').innerHTML = `<span class="live">● Live Market</span><br>${lines.join(' · ')}`;
    }
  } catch(e) {}
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.disabled = true;
  document.getElementById('typing').style.display = 'flex';
  try {
    await fetch('/api/user-message', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({content: text})
    });
  } catch(e) {}
  input.disabled = false;
  document.getElementById('typing').style.display = 'none';
  input.focus();
}

let isPlaying = false;

async function togglePlay() {
  if (isPlaying) {
    await fetch('/api/conversation/stop', {method: 'POST'});
  } else {
    await fetch('/api/conversation/start', {method: 'POST'});
  }
  await syncPlayStatus();
}

async function syncPlayStatus() {
  try {
    const res = await fetch('/api/conversation/status');
    const {running} = await res.json();
    if (running === isPlaying) return;
    isPlaying = running;
    document.getElementById('btn-play').style.display  = running ? 'none'  : 'inline-block';
    document.getElementById('btn-pause').style.display = running ? 'inline-block' : 'none';
    document.getElementById('typing').style.display = running ? 'flex' : 'none';
  } catch(e) {}
}

async function loadConsensus() {
  try {
    const res = await fetch('/api/consensus');
    const notes = await res.json();
    const list = document.getElementById('memo-list');
    const empty = document.getElementById('memo-empty');
    if (!notes.length) { if(empty) empty.style.display='block'; return; }
    if(empty) empty.style.display='none';
    list.innerHTML = '';
    notes.forEach((n, i) => {
      const d = document.createElement('div');
      d.className = 'memo-card';
      const t = new Date(n.created_at + 'Z').toLocaleString('ko-KR', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
      d.innerHTML = `<div class="memo-time">${t}</div><div class="memo-body">${esc(n.content)}</div>`;
      list.appendChild(d);
    });
  } catch(e) {}
}

loadAgents();
loadMarket();
poll();
syncPlayStatus();
loadConsensus();
setInterval(poll, 3000);
setInterval(loadMarket, 60000);
setInterval(syncPlayStatus, 5000);

async function syncUserMode() {
  try {
    const res = await fetch("/api/user/active");
    const {active} = await res.json();
    const banner = document.getElementById("user-mode-banner");
    if (banner) banner.style.display = active ? "block" : "none";
  } catch(e) {}
}
syncUserMode();
setInterval(syncUserMode, 10000);
setInterval(loadConsensus, 30000);
</script>
</body>
</html>
