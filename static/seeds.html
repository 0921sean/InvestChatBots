<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>S 병목 시드 결재 — InvestChatBots</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1117; color: #e2e8f0; padding: 20px 16px 60px; max-width: 560px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .brand-emoji { font-size: 20px; }
  .brand-text { font-size: 15px; font-weight: 700; }
  h1 { font-size: 15px; font-weight: 700; margin: 14px 0 2px; }
  .sub { font-size: 11px; color: #8b949e; margin-bottom: 16px; line-height: 1.5; }
  .sec { font-size: 12px; font-weight: 700; color: #8b949e; letter-spacing: .03em;
    margin: 22px 0 8px; text-transform: uppercase; }
  .row { background: #161b22; border: 1px solid #30363d; border-radius: 10px;
    padding: 12px 14px; margin-bottom: 8px; }
  .row.pending { border-color: #9e6a03; }
  .tk { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 15px; font-weight: 700; }
  .src { font-size: 10px; color: #6e7681; margin-left: 6px; font-weight: 500; }
  .why { font-size: 12px; color: #c9d1d9; margin-top: 4px; line-height: 1.5; }
  .acts { display: flex; gap: 8px; margin-top: 10px; }
  button { border: none; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 700;
    padding: 8px 14px; transition: opacity .15s; color: #fff; }
  button:active { opacity: .7; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .ok { background: #238636; flex: 1; }
  .no { background: #6e2f30; flex: 1; }
  .badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; }
  .b-app { background: #12331f; color: #56d364; }
  .b-rej { background: #3a2224; color: #f0757c; }
  .head { display: flex; justify-content: space-between; align-items: center; }
  .empty { font-size: 12px; color: #6e7681; padding: 6px 2px; }
  .add { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 12px 14px; margin-top: 6px; }
  .add input { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
    padding: 9px 11px; color: #e2e8f0; font-size: 13px; outline: none; margin-bottom: 8px; }
  .add input:focus { border-color: #58a6ff; }
  .add button { background: #1f6feb; width: 100%; }
  a.back { display: inline-block; margin-top: 24px; font-size: 11px; color: #6e7681; text-decoration: none; }
</style>
</head>
<body>
  <div class="brand"><span class="brand-emoji">🔩</span><span class="brand-text">S 병목 시드 결재</span></div>
  <div class="sub">S(병목)봇 워치리스트 = 아래 <b>승인(approved)</b>된 티커. 발굴은 Claude·평가/매매는 S봇, <b>승인은 사장님</b>.</div>

  <div class="sec">🟡 결재 대기</div>
  <div id="pending"></div>

  <div class="sec">➕ 수동 추가</div>
  <div class="add">
    <input id="addTk" placeholder="티커 (예: AXTI)" autocapitalize="characters" />
    <input id="addWhy" placeholder="근거 — 왜 병목인지 (선택)" />
    <button onclick="addSeed()">pending으로 등록</button>
  </div>

  <div class="sec">🟢 승인됨 (S 워치리스트)</div>
  <div id="approved"></div>

  <div class="sec">⚪ 반려</div>
  <div id="rejected"></div>

  <a class="back" href="/admin">← 관리자 홈</a>

<script>
const esc = s => (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load() {
  const r = await fetch('/api/bottleneck/seeds', { credentials: 'same-origin' });
  if (!r.ok) { document.getElementById('pending').innerHTML = '<div class="empty">권한이 없습니다. /admin에서 로그인하세요.</div>'; return; }
  const items = (await r.json()).items || [];
  const by = s => items.filter(i => i.status === s);

  const pend = by('pending');
  document.getElementById('pending').innerHTML = pend.length ? pend.map(i => `
    <div class="row pending">
      <div><span class="tk">${esc(i.ticker)}</span><span class="src">${esc(i.source||'')}</span></div>
      ${i.rationale ? `<div class="why">${esc(i.rationale)}</div>` : ''}
      <div class="acts">
        <button class="ok" onclick="decide('${esc(i.ticker)}','approved',this)">✅ 승인</button>
        <button class="no" onclick="decide('${esc(i.ticker)}','rejected',this)">❌ 반려</button>
      </div>
    </div>`).join('') : '<div class="empty">대기 중인 후보가 없습니다.</div>';

  const app = by('approved');
  document.getElementById('approved').innerHTML = app.length ? app.map(i => `
    <div class="row"><div class="head"><span class="tk">${esc(i.ticker)}</span>
      <span class="badge b-app">approved</span></div>
      ${i.rationale ? `<div class="why">${esc(i.rationale)}</div>` : ''}</div>`).join('')
    : '<div class="empty">아직 없습니다.</div>';

  const rej = by('rejected');
  document.getElementById('rejected').innerHTML = rej.length ? rej.map(i => `
    <div class="row"><div class="head"><span class="tk">${esc(i.ticker)}</span>
      <span class="badge b-rej">rejected</span></div></div>`).join('')
    : '<div class="empty">없습니다.</div>';
}

async function decide(ticker, status, btn) {
  btn.disabled = true;
  const r = await fetch('/api/bottleneck/seeds/decide', {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ticker, status }),
  });
  if (!r.ok) { btn.disabled = false; alert('실패: ' + (await r.text())); return; }
  load();
}

async function addSeed() {
  const ticker = document.getElementById('addTk').value.trim();
  if (!ticker) return;
  const rationale = document.getElementById('addWhy').value.trim();
  const r = await fetch('/api/bottleneck/seeds/add', {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ticker, rationale }),
  });
  if (!r.ok) { alert('실패: ' + (await r.text())); return; }
  document.getElementById('addTk').value = '';
  document.getElementById('addWhy').value = '';
  load();
}

load();
</script>
</body>
</html>
