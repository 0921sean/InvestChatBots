name: PR Title Lint

# PR 제목이 컨벤션 "[Type] #번호 - 내용" 형식인지 검사. 아니면 실패로 머지 게이트.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^\[(Feat|Fix|Hotfix|Refactor|Design|Setting|Docs|Test|Chore)\] #[0-9]+ - .+'
          if echo "$TITLE" | grep -qE "$pattern"; then
            echo "✓ 제목 형식 OK: $TITLE"
          else
            echo "✗ PR 제목 컨벤션 위반: '$TITLE'"
            echo "  형식: [Type] #번호 - 내용"
            echo "  Type: Feat/Fix/Hotfix/Refactor/Design/Setting/Docs/Test/Chore"
            exit 1
          fi
