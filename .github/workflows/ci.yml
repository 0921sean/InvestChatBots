name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (compileall)
        run: python -m compileall -q .

      - name: Run offline-safe tests
        # 네트워크/API키/DB 없이 도는 유닛 테스트만. 통합 테스트(test_fetchers,
        # test_orchestrator 등)는 나중에 secrets 붙인 별도 워크플로우로 분리.
        run: >
          pytest -q
          tests/test_db.py
          tests/test_chat_queue.py
          tests/test_output_schema.py
          tests/test_chat_guardrail.py
